<head>
<meta charset="utf-8">
<script>
/* dark is the default for new visitors; use the saved theme before the first paint, so light-mode users do not see a dark flash */
(function(){ try{ var s = JSON.parse(localStorage.getItem('sprachrakete') || 'null'); if (s && s.set && s.set.theme === 'light') document.documentElement.setAttribute('data-theme', 'light'); }catch(e){} })();
</script>
<script>
/* move to sprachrakete.app with progress */
(function(){
  var NEW = 'https://sprachrakete.app';
  var OLD = location.hostname === 'mohnned7.github.io';
  try{
    if (OLD){
      if (/[?&]stay\b/.test(location.search)) return;
      var d = {}, n = 0;
      for (var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if (k === 'sprachrakete' || /^sr[-_]/.test(k)){ d[k] = localStorage.getItem(k); n++; } }
      var to = location.hash || '', h = to;
      if (n){ var b = btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); h = '#import=' + b + (to ? '&to=' + encodeURIComponent(to) : ''); }
      location.replace(NEW + '/' + h);
      document.documentElement.style.display = 'none';
      return;
    }
    var m = location.hash.match(/^#import=([^&]*)(?:&to=(.*))?$/);
    if (m){
      var t = m[2] ? decodeURIComponent(m[2]) : '';
      try{
        var s = m[1].replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
        var data = JSON.parse(decodeURIComponent(escape(atob(s))));
        var sc = function(x){ if (!x) return -1; var c = 0; for (var q in (x.done || {})) c++; return (x.xp || 0) + c * 10; };
        var cur = null; try{ cur = JSON.parse(localStorage.getItem('sprachrakete') || 'null'); }catch(e){}
        for (var key in data){
          if (key === 'sprachrakete'){ var inc = null; try{ inc = JSON.parse(data[key]); }catch(e){} if (inc && sc(inc) > sc(cur)) localStorage.setItem(key, data[key]); }
          else if (localStorage.getItem(key) === null) localStorage.setItem(key, data[key]);
        }
        localStorage.setItem('sr-moved', '1');
      }catch(e){}
      history.replaceState(null, '', location.pathname + (t && t !== '#' ? t : ''));
    }
  }catch(e){ if (OLD) location.replace(NEW + '/'); }
})();
</script>
